# Runs the whole analysis on the small synthetic dataset produced by
# examples/make_sample_data.py. Use it to check the installation works before
# using the code on real model output.
#
#   python examples/make_sample_data.py
#   python 01_areal_SMEV.py --config configs/example.yaml
#   python 02_spatial_metrics.py --config configs/example.yaml
#   python 03_temp_scaling.py --config configs/example.yaml
#
# The whole thing should finish in a couple of minutes on a laptop. The
# results are meaningless though; but every stage runs exactly the code path the real analysis uses.

family: EXAMPLE

models:
  - SAMPLE

periods:
  - Historical
  - Rcp85

ws_list: [1, 3, 5]

paths:
  input_dir: "examples/sample_data"
  input_file: "{MODEL}_pr_{PERIOD}_merged.nc"
  output_dir: "examples/output/{PERIOD}/{MODEL}"
  staging_dir: "examples/output/_staging"
  tas_file: "examples/sample_data/{MODEL}_tas_{PERIOD}_merged.nc"

tiling:
  ny_tile: 6
  nx_tile: 7

parallelism:
  n_inner_workers: 2
  n_outer_jobs: 1
  n_proc_regression: 2
  chunk_size: 1000000
  n_load_workers: 2
  max_task_workers: 2

spatial_subset: null

uncertainty:
  enabled: true
  niter: 100
