# General settings shared by BOTH the CPM and the RCM runs.
#
# Model-specific settings (paths, model lists, window sizes, tiling) live in
# configs/cpm.yaml and configs/rcm.yaml, which are merged on top of this file.


# Aggregation durations in hours. These define the band order of the output
# GeoTIFFs, so changing them changes the output layout.
durations_h: [1, 3, 6, 12, 24]

# Return periods in years, used for the SMEV return levels.
return_periods: [2, 5, 10, 20, 50, 100]


# Ordinary-event (OE) extraction
ordinary_events:
  # Name of the precipitation variable and time coordinate in the input NetCDF.
  var_name: pr
  time_name: time

  # A timestep counts as wet when precipitation >= min_rain (mm/h).
  min_rain: 0.1

  # Two wet spells are treated as independent storms when separated by MORE
  # than this many dry hours.
  separation_h: 24

  # Temporal resolution of the input precipitation data, in minutes.
  time_res_min: 60

  # Events shorter than this (minutes) are discarded.
  min_event_duration_min: 60

  # Maximum fraction of missing data tolerated within a year before that
  # year is dropped.
  tolerance: 0.1


# SMEV Weibull fit
smev:
  # Left-censoring window as [lower, upper] probability limits.
  # [0.85, 1] keeps the largest 15 % of ordinary events for the Weibull fit.
  # This must match between the point estimate and the bootstrap.
  left_censoring: [0.85, 1]


# Bootstrap uncertainty (optional stage)
uncertainty:
  # When false, the bootstrap is skipped entirely.
  enabled: false

  # Number of year-block bootstrap iterations per grid cell and duration.
  niter: 1000

  # Percentiles extracted from the bootstrap distribution.
  # [5, 95] gives a 90 % confidence interval.
  ci_percentiles: [5.0, 95.0]

  # Base seed. Per-cell seeds are derived deterministically from this value,
  # so a rerun with the same seed reproduces the same intervals exactly.
  random_seed: 12345

  # Output subdirectory.
  ci_subdir: quantiles_CIs


# Spatial metrics (script 02)
spatial_metrics:
  # Area fractions for the storm-area metrics. A_50 is the area holding the
  # wettest 50 % of the event total. These become the column name in the output.
  # you can compute multiple area fractions by adding more values to the list, e.g. [0.50, 0.75].
  a_fractions: [0.50]

  # Alpha levels for the precipitation-concentration metrics, written as columns PCA_50.
  # You can compute multiple alpha levels by adding more values to the list, e.g. [0.50, 0.25].
  pca_alphas: [0.50]

  # Decimal places used when matching parquet lat/lon values back onto the
  # NetCDF grid. Guards against float round-trip mismatches.
  coord_decimals: 7

  # Arrow read batch size and the row count that triggers a write flush.
  # Larger values use more memory but reduce write overhead.
  arrow_batch_size: 1000000
  write_buffer_rows: 400000


# Temperature scaling (script 03)
temperature_scaling:
  # Which part of stage 03 to run. Override on the command line with --run-mode.
  #   tpre24            pair events with pre-event temperature, save every tail event
  #   tpre24_SAVE_MEANS same, but save one row per tail instead of per event
  #   scaling           only the quantile regression
  #   both              the full steps
  run_mode: tpre24_SAVE_MEANS

  # Quantile levels for the quantile regression of log(OE) on T_pre24.
  quantiles: [0.85, 0.90, 0.95, 0.99]

  # Grid cells with fewer than this many tail events are not fitted.
  min_events_regression: 50

  # Length of the pre-event temperature averaging window, in hours.
  temp_window_h: 24


# Output file formats
output:
  parquet:
    compression: zstd
    zstd_level: 3
  geotiff:
    dtype: float32
    compress: lzw
    nodata: .nan
